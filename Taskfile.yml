# https://taskfile.dev
version: 3

includes:
  go:
    taskfile: https://github.com/unikraft-cloud/x.git//Taskfile.go.yml?ref=prod-staging
    vars:
      go_module: unikraft.com/cli

# TODO: svu?

tasks:
  default:
    cmds:
    - task: cli

  cli:
    cmds:
    - task: go:build
      vars:
        package: ./cmd/unikraft

  unit:
    cmds:
    - task: go:test

  integration:
    cmds:
    - task: go:test
      vars:
        go_tags: "integration"
        package: ./cmd/unikraft

  integration-update:
    cmd: >-
      go test -v ./cmd/unikraft -tags integration --update
