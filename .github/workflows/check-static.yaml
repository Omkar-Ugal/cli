name: check/static

on:
  push:
    branches: [prod-staging, prod-stable]
  pull_request:
    branches:
    - prod-staging
    paths:
    - '**'
    - '!.github/**'
    - .github/workflows/check-static.yaml

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Configure git for private Go module (go-sdk-internal)
      shell: bash
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        git config --global url."https://x-access-token:${GH_PAT}@github.com/unikraft-cloud/go-sdk-internal".insteadOf "https://github.com/unikraft-cloud/go-sdk-internal"
        echo "GOPRIVATE=github.com/unikraft-cloud/go-sdk-internal" >>"$GITHUB_ENV"

    - uses: go-task/setup-task@v2

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Set Go variables
      id: goenv
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "mod=$(go env GOMOD)"
        } >>"$GITHUB_OUTPUT"

    - name: Go caches
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
        key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
        restore-keys: |
          ${{ github.job }}-${{ runner.os }}-go-

    - name: Run checks
      shell: bash
      run: |
          task go:ci/check
